# Store uploaded files and backups on a NAS export mounted by Docker over NFS
# (Synology, QNAP, TrueNAS, Linux servers...), without mounting it on the host first.
#
# 1. On the NAS, export a folder that contains two folders: "data" and "backups", writable by
#    the uid/gid in APP_UID/APP_GID (or with a squash rule mapping to them).
# 2. On the Docker host, install the NFS client, e.g. `sudo apt install nfs-common`.
# 3. In .env set NAS_HOST and NAS_NFS_EXPORT (e.g. /volume1/information-board), keep
#    STORAGE_BACKEND=local, and enable this file:
#      COMPOSE_PATH_SEPARATOR=:
#      COMPOSE_FILE=docker-compose.yml:docker-compose.nas-nfs.yml
# 4. docker compose up -d
#
# See docs/storage.md for details.

services:
  backend:
    volumes:
      - board_data:/data
      - board_backups:/backups
  worker:
    volumes:
      - board_data:/data
      - board_backups:/backups

volumes:
  board_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST:?Set NAS_HOST in .env},rw,nfsvers=4.1"
      device: ":${NAS_NFS_EXPORT:?Set NAS_NFS_EXPORT in .env}/data"
  board_backups:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_HOST},rw,nfsvers=4.1"
      device: ":${NAS_NFS_EXPORT}/backups"
