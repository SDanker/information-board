name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: NAS over SMB override
        run: docker compose -f docker-compose.yml -f docker-compose.nas-smb.yml config --quiet
        env:
          NAS_HOST: nas.example
          NAS_SHARE: board
          NAS_USERNAME: board
          NAS_PASSWORD: example
      - name: NAS over NFS override
        run: docker compose -f docker-compose.yml -f docker-compose.nas-nfs.yml config --quiet
        env:
          NAS_HOST: nas.example
          NAS_NFS_EXPORT: /volume1/board
      - run: python3 scripts/setup.py --help
