# Store uploaded files and backups on a NAS share mounted by Docker over SMB/CIFS
# (Windows shares, Synology, QNAP, TrueNAS, UNAS...), without mounting it on the host first.
#
# 1. On the NAS, create a share containing two empty folders: "data" and "backups".
# 2. On the Docker host, install the CIFS client, e.g. `sudo apt install cifs-utils`.
# 3. In .env set NAS_HOST, NAS_SHARE, NAS_USERNAME, NAS_PASSWORD (and optionally
#    NAS_SMB_VERSION), keep STORAGE_BACKEND=local, and enable this file:
#      COMPOSE_PATH_SEPARATOR=:
#      COMPOSE_FILE=docker-compose.yml:docker-compose.nas-smb.yml
# 4. docker compose up -d
#
# The password must not contain commas, because Docker passes mount options as a
# comma-separated list. See docs/storage.md for details.

x-smb-options: &smb-options "username=${NAS_USERNAME:?Set NAS_USERNAME in .env},password=${NAS_PASSWORD:?Set NAS_PASSWORD in .env},uid=${APP_UID:-1000},gid=${APP_GID:-1000},vers=${NAS_SMB_VERSION:-3.0},file_mode=0660,dir_mode=0770"

services:
  backend:
    volumes:
      - board_data:/data
      - board_backups:/backups
  worker:
    volumes:
      - board_data:/data
      - board_backups:/backups

volumes:
  board_data:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST:?Set NAS_HOST in .env}/${NAS_SHARE:?Set NAS_SHARE in .env}/data"
      o: *smb-options
  board_backups:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST}/${NAS_SHARE}/backups"
      o: *smb-options
